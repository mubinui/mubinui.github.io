omesCloser\":\"grow\"},{\"entityId\":\"stomach\",\"characterId\":\"stomach\",\"comesCloser\":\"grow\"},{\"entityId\":\"bone\",\"characterId\":\"bone\",\"comesCloser\":\"grow\"}],\"sounds\":[],\"characters\":[{\"id\":\"heart\",\"name\":\"Captain Heart\",\"nameBn\":\"ক্যাপ্টেন ধুকপুক\",\"look\":\"A coral heart with tiny gloved hands and a courier satchel.\",\"facts\":[\"I am a muscle inside your chest.\",\"I squeeze to send blood around your body.\",\"Blood carries oxygen and nutrients to your cells.\",\"I keep working while you sleep.\",\"My four chambers work together.\",\"When you move, I can beat faster to help your muscles.\"],\"factsBn\":[\"আমি তোমার বুকের ভেতরের একটি পেশি।\",\"আমি সংকুচিত হয়ে সারা শরীরে রক্ত পাঠাই।\",\"রক্ত কোষে অক্সিজেন ও পুষ্টি নিয়ে যায়।\",\"তুমি ঘুমালেও আমি কাজ করি।\",\"আমার চারটি প্রকোষ্ঠ একসঙ্গে কাজ করে।\",\"তুমি নড়াচড়া করলে পেশিকে সাহায্য করতে আমি দ্রুত চলতে পারি।\"],\"catchphrase\":\"Delivery for every cell!\",\"catchphraseBn\":\"প্রতিটি কোষে পৌঁছে দিই!\"},{\"id\":\"lungs\",\"name\":\"Breeze \u0026 Puff\",\"nameBn\":\"দমু আর ফুঁ\",\"look\":\"Two soft pink lungs with a branching airway and friendly faces.\",\"facts\":[\"We are a pair of organs in your chest.\",\"Air enters through your nose or mouth.\",\"Oxygen from air moves into your blood in our tiny air sacs.\",\"Carbon dioxide moves from blood into air you breathe out.\",\"Your diaphragm helps move air in and out.\",\"We work with your heart to supply your body.\"],\"factsBn\":[\"আমরা বুকের ভেতরের এক জোড়া অঙ্গ।\",\"নাক বা মুখ দিয়ে বাতাস ঢোকে।\",\"আমাদের ছোট বায়ুথলি থেকে অক্সিজেন রক্তে যায়।\",\"রক্তের কার্বন ডাইঅক্সাইড নিঃশ্বাসে বের হয়।\",\"ডায়াফ্রাম বাতাস ঢোকাতে ও বের করতে সাহায্য করে।\",\"আমরা হৃৎপিণ্ডের সঙ্গে শরীরকে সাহায্য করি।\"],\"catchphrase\":\"Room for a little fresh air!\",\"catchphraseBn\":\"একটু বাতাসের জায়গা দাও!\"},{\"id\":\"brain\",\"name\":\"Professor Brain\",\"nameBn\":\"মস্তিষ্ক মামা\",\"look\":\"A lavender folded brain with a little bow tie and bright eyes.\",\"facts\":[\"I help you think, learn and remember.\",\"I receive messages from your senses.\",\"I send messages that help you move.\",\"Nerves carry messages between me and your body.\",\"Different areas of me do different jobs.\",\"Sleep helps your brain and body rest.\"],\"factsBn\":[\"আমি ভাবতে, শিখতে আর মনে রাখতে সাহায্য করি।\",\"ইন্দ্রিয় থেকে আমি খবর পাই।\",\"আমি নড়াচড়ার জন্য খবর পাঠাই।\",\"স্নায়ু আমার আর শরীরের মধ্যে খবর নিয়ে যায়।\",\"আমার ভিন্ন অংশ ভিন্ন কাজ করে।\",\"ঘুম মস্তিষ্ক ও শরীরকে বিশ্রাম দেয়।\"],\"catchphrase\":\"One bright idea coming through!\",\"catchphraseBn\":\"একটা বুদ্ধি আসছে!\"},{\"id\":\"stomach\",\"name\":\"Chef Tummy\",\"nameBn\":\"পাকু রাঁধুনি\",\"look\":\"A peach stomach with a chef scarf and a soft curved silhouette.\",\"facts\":[\"I am a stretchy organ, not your whole belly.\",\"Food reaches me after you swallow.\",\"My muscles mix food with digestive juices.\",\"Digestion breaks food into smaller parts.\",\"Your small intestine absorbs most nutrients.\",\"Many organs share the job of digestion.\"],\"factsBn\":[\"আমি প্রসারিত হতে পারা একটি অঙ্গ, পুরো পেট নই।\",\"গিলে ফেলার পর খাবার আমার কাছে আসে।\",\"আমার পেশি খাবারকে পাচকরসের সঙ্গে মেশায়।\",\"হজম খাবারকে ছোট অংশে ভাঙে।\",\"ক্ষুদ্রান্ত্র বেশির ভাগ পুষ্টি শোষণ করে।\",\"অনেক অঙ্গ মিলে হজমের কাজ করে।\"],\"catchphrase\":\"Mix, squish, pass it on!\",\"catchphraseBn\":\"মেশাও, নাড়ো, পাঠিয়ে দাও!\"},{\"id\":\"bone\",\"name\":\"Boni the Builder\",\"nameBn\":\"হাড়ু মিস্ত্রি\",\"look\":\"A friendly ivory long bone with rounded ends and a green tool belt.\",\"facts\":[\"Bones form your skeleton.\",\"Your skeleton supports your body.\",\"Your skull helps protect your brain.\",\"Ribs help protect your heart and lungs.\",\"Muscles pull on bones to help you move.\",\"Joints are places where bones meet.\"],\"factsBn\":[\"হাড় মিলে তোমার কঙ্কাল তৈরি করে।\",\"কঙ্কাল শরীরকে অবলম্বন দেয়।\",\"খুলি মস্তিষ্ককে রক্ষা করে।\",\"পাঁজর হৃৎপিণ্ড ও ফুসফুস রক্ষা করে।\",\"পেশি হাড়কে টেনে নড়তে সাহায
